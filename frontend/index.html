<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A1128" />
    <meta name="description" content="DevPulse is a real-time Visual CI/CD Pipeline Monitoring Dashboard with 0-100% role handoff alerts, 1-Click Git sync, intelligent failure diagnostics, and Docker telemetry." />
    
    <!-- OpenGraph / Social Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevPulse — Visual CI/CD Pipeline Monitoring & DevOps Cockpit" />
    <meta property="og:description" content="Real-time Visual CI/CD Pipeline Monitoring Dashboard with 0-100% role handoff alerts, 1-Click Git sync, intelligent failure diagnostics, and Docker telemetry." />
    <meta property="og:url" content="https://github.com/Shwetankjais/cdd_minorproj" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevPulse — Visual CI/CD Pipeline Monitoring & DevOps Cockpit" />
    <meta name="twitter:description" content="Real-time Visual CI/CD Pipeline Monitoring Dashboard with 0-100% role handoff alerts, 1-Click Git sync, intelligent failure diagnostics, and Docker telemetry." />

    <title>DevPulse — Visual CI/CD Pipeline Monitoring & DevOps Cockpit</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('devpulse-theme') || 'dark';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#FAF8F5] text-[#0F172A] dark:bg-[#0A1128] dark:text-[#F8FAFC] antialiased min-h-screen selection:bg-[#D4AF37] selection:text-[#0A1128] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
