<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>DevPulse - Visual CI/CD Pipeline Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338BDF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('devpulse-theme') || 'dark';
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-[#0B1120] dark:text-slate-100 antialiased min-h-screen selection:bg-sky-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
