services:
  db:
    image: postgres:15
    container_name: devpulse-db
    environment:
      POSTGRES_DB: devpulse
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpulse_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    image: devpulse-backend:latest
    container_name: devpulse-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://devpulse:${POSTGRES_PASSWORD:-devpulse_local}@db:5432/devpulse
      DEVPULSE_COMPOSE: "1"
      DEVPULSE_SESSION_COOKIE_SCOPE: ${COMPOSE_PROJECT_NAME}
      DEVPULSE_HOST_HOME: /host
      DEVPULSE_REPO: /workspace/project
      DEVPULSE_WORKSPACE: /workspace/project/workspace
      GIT_WRITE_TOKEN: ${GIT_WRITE_TOKEN-devpulse-viva-token}
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: store --file=/workspace/project/backend/.git-credentials
      GIT_CONFIG_KEY_1: credential.useHttpPath
      GIT_CONFIG_VALUE_1: "true"
    volumes:
      - .:/workspace/project
      - "${DEVPULSE_HOST_HOME:-${HOME:-${USERPROFILE}}}/Desktop:/host/Desktop:rw"
      - "${DEVPULSE_HOST_HOME:-${HOME:-${USERPROFILE}}}/Downloads:/host/Downloads:rw"
      - "${DEVPULSE_HOST_HOME:-${HOME:-${USERPROFILE}}}/Documents:/host/Documents:rw"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM node:20-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        ENV VITE_API_URL=/api
        RUN npm run build
        FROM nginx:alpine
        COPY --from=build /app/dist /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
    image: devpulse-frontend:latest
    container_name: devpulse-frontend
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
