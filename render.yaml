services:
  - type: web
    name: devpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DEVPULSE_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-db
          property: connectionString
      - key: DEVPULSE_SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: DEVPULSE_CORS_ORIGINS
        sync: false

databases:
  - name: devpulse-db
    ipAllowList: []
